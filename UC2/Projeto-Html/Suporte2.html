           <main>
        <section id="formulario2">
            <form action="#" method="post">
                <h1>Formulário de Suporte</h1>

                <div class="grupo-campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Exemplo: Pedro" required>
                </div>

                <div class="grupo-campo">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" placeholder="Exemplo: Santos" required>
                </div>

                <div class="grupo-campo">
                    <label for="email">E-mail ✉️</label>
                    <input type="email" id="email" name="e-mail" placeholder="exemplo@gmail.com" required>
                </div>

                <div class="grupo-campo">
                    <label for="telefone">Telefone 📞 <span class="opcional">(Opcional)</span></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(21) 99999-9999" pattern="\(?\d{2}\)\s?\d{5,4}-?\d{4}">
                </div>

                <div class="grupo-campo">
                    <label for="campodigitar">Descreva o seu ocorrido</label>
                    <textarea name="digitar" id="campodigitar" rows="5" placeholder="Descreva o problema em detalhes aqui..." required></textarea>
                </div>

                <button type="submit" class="enviar">Enviar Mensagem</button>
            </form>
        </section>
</main>

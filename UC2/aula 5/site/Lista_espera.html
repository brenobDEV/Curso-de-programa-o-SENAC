    <h2>Formulário para Lista-De-Espera</h2>
    <br><br>
    <form action="#" method="post">
        <h2>Formulário</h2>
        <div class="campo">
            <label for="name">Digite seu nome: </label>
                <input 
                    type="text"
                    id="nome"
                    placeholder="Exemplo:   Pedro"
                    required>
        </div>

        <div class="campo">
            <label for="idade">Sua idade:</label>
            <input 
            type="number"
            id="idade"
            placeholder="Sua idade"
            min="16"
            required>
            
        </div>

        <div class="campo">
            <label for="email"> E-mail</label>
            <input
            type="email"
            id="email"
            name="e-mail"
            placeholder="e-mail@gmail.com"
            required >

        </div>

        <div class="campo">
            <label for="telefone">Telefone (Opcional)</label>
            <input 
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(21) 99999-9999"
            pattern="\(?\d{2}\)\s?\d{5,4}-?\d{4}"> 

        </div>
    <br>
    <br>
        <section id="bb"></section>
        <button class="butao_campo" type="submit">Enviar formulário</button> 
        <br>
    </section>
    </form>

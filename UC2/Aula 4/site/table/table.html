<!DOCTYPE html>

</head>
<body>
    <header><h1>EXEMPLOS TABLE</h1></header>

        <tr>
        <th scope="col">Letras</th>

        <th scope="col">Números</th>

       </tr>

        <td>3</td>
    </tr>


    </table>
